name: Melhorias de qualidade para AdSense

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'index.html'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: python3 -m pip install beautifulsoup4 --quiet

      - name: Aplicar limpeza e melhorias
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from bs4 import BeautifulSoup

          root = Path('.')
          changed = []

          # Remove resíduos de geração/referências internas que nunca devem
          # aparecer para o visitante. Também remove cercas Markdown acidentais
          # que estejam dentro de HTML publicado.
          artifact_patterns = [
              re.compile(r':contentReference\[[^\]]*\]\{[^}]*\}', re.I),
              re.compile(r'oaicite:\s*\d+', re.I),
          ]

          for path in root.rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8-sig')
              original = text

              for pattern in artifact_patterns:
                  text = pattern.sub('', text)

              text = text.replace('```html', '').replace('```HTML', '').replace('```', '')

              text = re.sub(
                  r'<meta\s+name=["\']author["\']\s+content=["\'][^"\']*["\']\s*/?>',
                  '<meta name="author" content="Edson Emanuel Previatti">',
                  text,
                  flags=re.I,
              )

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          # Remove da página inicial a calculadora de rescisão, preservando as
          # demais calculadoras e seus scripts.
          index = root / 'index.html'
          text = index.read_text(encoding='utf-8-sig')
          original = text
          soup = BeautifulSoup(text, 'html.parser')
          for box in soup.select('.calculator'):
              h3 = box.find('h3')
              if h3 and 'calculadora de rescisão' in h3.get_text(' ', strip=True).lower():
                  box.decompose()
          text = str(soup)

          if text != original:
              index.write_text(text, encoding='utf-8')
              if 'index.html' not in changed:
                  changed.append('index.html')

          # Cria na home uma seção editorial útil, sem promessas de aconselhamento,
          # explicando como o visitante deve consultar os materiais.
          text = index.read_text(encoding='utf-8')
          if 'id="como-usar-conteudo"' not in text:
              marker = '<section class="section" id="rescisao"'
              section = '''<section class="section" id="como-usar-conteudo" aria-labelledby="titulo-como-usar-conteudo">\n<div class="container">\n<span class="tag">COMO USAR O RH SEM COMPLICAÇÃO</span>\n<h2 id="titulo-como-usar-conteudo">Informação trabalhista para consultar antes de agir</h2>\n<p>O RH sem Complicação reúne explicações, exemplos, fontes oficiais e ferramentas estimativas para ajudar o trabalhador a compreender situações comuns da vida profissional.</p>\n<div class="article-highlight">\n<strong>Como consultar:</strong> encontre o tema relacionado ao seu caso, leia a explicação completa, confira exemplos e exceções e consulte a legislação indicada. Se a situação depender de contrato, categoria profissional ou convenção coletiva, confirme os detalhes antes de tomar uma decisão.\n</div>\n<p>Os materiais têm finalidade educativa e informativa. Eles não substituem a análise individual de documentos nem orientação jurídica ou profissional.</p>\n</div>\n</section>\n\n'''
              if marker in text:
                  text = text.replace(marker, section + marker, 1)
              else:
                  text = text.replace('</main>', section + '</main>', 1)
              index.write_text(text, encoding='utf-8')
              if 'index.html' not in changed:
                  changed.append('index.html')

          print('Arquivos alterados:')
          for item in sorted(set(changed)):
              print(' -', item)
          PY

      - name: Verificar arquivos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = list(Path('.').rglob('*.html'))
          errors = []
          for p in files:
              t = p.read_text(encoding='utf-8-sig', errors='replace')
              if re.search(r':contentReference\[|oaicite\s*:', t, re.I):
                  errors.append(f'Resíduo de referência: {p}')
              if '```' in t:
                  errors.append(f'Cerca Markdown dentro do HTML: {p}')
              if '<h1' not in t.lower():
                  errors.append(f'Sem H1: {p}')
              if '<title' not in t.lower():
                  errors.append(f'Sem title: {p}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'OK: {len(files)} arquivos HTML verificados.')
          PY

      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html artigos .github/workflows/qualidade-adsense.yml
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
          else
            git commit -m "Limpa artefatos e melhora preparação para AdSense [skip ci]"
            git push
          fi
