name: Melhorias de qualidade para AdSense

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'index.html'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: python3 -m pip install beautifulsoup4 --quiet

      - name: Limpar e melhorar páginas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from bs4 import BeautifulSoup

          root = Path('.')
          changed = []

          artifact_patterns = [
              re.compile(r':contentReference\[[^\]]*\]\{[^}]*\}', re.I),
              re.compile(r'oaicite:\s*\d+', re.I),
          ]

          html_files = []
          for path in root.rglob('*.html'):
              if '.git' in path.parts:
                  continue
              html_files.append(path)

              text = path.read_text(encoding='utf-8-sig')
              original = text

              for pattern in artifact_patterns:
                  text = pattern.sub('', text)

              text = text.replace('```html', '').replace('```HTML', '').replace('```', '')

              text = re.sub(
                  r'<meta\s+name=["\']author["\']\s+content=["\'][^"\']*["\']\s*/?>',
                  '<meta name="author" content="Edson Emanuel Previatti">',
                  text,
                  flags=re.I,
              )

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          index = root / 'index.html'
          index_text = index.read_text(encoding='utf-8-sig')
          original_index = index_text
          soup = BeautifulSoup(index_text, 'html.parser')
          ids = {tag.get('id') for tag in soup.find_all(attrs={'id': True})}
          for a in soup.find_all('a', href=True):
              href = a['href']
              if href.startswith('#') and href[1:] not in ids:
                  a['href'] = '#artigos'
          index_text = str(soup)
          if index_text != original_index:
              index.write_text(index_text, encoding='utf-8')
              changed.append('index.html')

          for path in html_files:
              if path == index:
                  continue
              text = path.read_text(encoding='utf-8-sig')
              original = text
              text = text.replace('../index.html#rescisao', '../index.html#artigos')
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          for path in html_files:
              if path == index:
                  continue
              text = path.read_text(encoding='utf-8-sig')
              if 'class="article-byline"' not in text and '<div class="article-header">' in text:
                  byline = '''\n<p class="article-byline"><strong>Por Edson Emanuel Previatti</strong> — Profissional de Recursos Humanos</p>\n'''
                  text = text.replace('</div>\n\n\n\n        <article class="article-content">', '</div>' + byline + '\n\n        <article class="article-content">', 1)
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Arquivos alterados:')
          for item in sorted(set(changed)):
              print(' -', item)
          PY

      - name: Verificar qualidade mínima
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from bs4 import BeautifulSoup

          files = [p for p in Path('.').rglob('*.html') if '.git' not in p.parts]
          errors = []

          for p in files:
              t = p.read_text(encoding='utf-8-sig', errors='replace')
              if re.search(r':contentReference\[|oaicite\s*:', t, re.I):
                  errors.append(f'Resíduo de referência: {p}')
              if '```' in t:
                  errors.append(f'Cerca Markdown dentro do HTML: {p}')
              soup = BeautifulSoup(t, 'html.parser')
              if not soup.find('h1'):
                  errors.append(f'Sem H1: {p}')
              if not soup.find('title'):
                  errors.append(f'Sem title: {p}')
              # Nem todo artigo legado usa <main>; a home deve ter essa estrutura.
              if p == Path('index.html') and not soup.find('main'):
                  errors.append(f'Sem main: {p}')

              ids = {tag.get('id') for tag in soup.find_all(attrs={'id': True})}
              for a in soup.find_all('a', href=True):
                  href = a['href']
                  if href.startswith('#') and href[1:] and href[1:] not in ids:
                      errors.append(f'Âncora inexistente {href}: {p}')

          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'OK: {len(files)} arquivos HTML verificados.')
          PY

      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html artigos .github/workflows/qualidade-adsense.yml
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
          else
            git commit -m "Limpa artefatos e melhora qualidade para AdSense [skip ci]"
            git push
          fi
